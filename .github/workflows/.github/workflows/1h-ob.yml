name: 1H Order Block Scanner

on:
  workflow_dispatch:

concurrency:
  group: orderblock-1h-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install requests websocket-client

      - name: Start 1H Order Block Scanner
        env:
          ORDERBLOCK_1H_DISCORD_WEBHOOK_URL: ${{ secrets.ORDERBLOCK_1H_DISCORD_WEBHOOK_URL }}
        run: |
          python orderblock_1h.py
